name: Build Local Photo AI APK

concurrency:
  group: sunny-local-ai-gallery-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.13"
  EMBEDDING_MODEL_URL: "https://huggingface.co/litert-community/embeddinggemma-2-text-vision-440m-litert-lm/resolve/main/embeddinggemma-2-text-vision-440m.litertlm"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare bundled EmbeddingGemma 2 model
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors "$EMBEDDING_MODEL_URL" -o app/src/main/assets/models/embeddinggemma-2-text-vision-440m.litertlm
          test -s app/src/main/assets/models/embeddinggemma-2-text-vision-440m.litertlm
          ls -lh app/src/main/assets/models/embeddinggemma-2-text-vision-440m.litertlm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build release APK and App Bundle
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Verify installable debug APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "Installable debug APK: $APK"
          ls -lh "$APK"

      - name: Verify bundled model is inside APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          unzip -l "$APK" | grep 'assets/models/embeddinggemma-2-text-vision-440m.litertlm'
          ls -lh "$APK"

      - name: Verify release bundle
        run: |
          BUNDLE=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -s "$BUNDLE"
          ls -lh "$BUNDLE"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SunnyLocalAIGallery-installable-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK for Play/signing pipeline
        uses: actions/upload-artifact@v4
        with:
          name: SunnyLocalAIGallery-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SunnyLocalAIGallery-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Rename and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

