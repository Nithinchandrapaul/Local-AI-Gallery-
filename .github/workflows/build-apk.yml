name: Build Local Photo AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.13"
  EMBEDDING_MODEL_URL: "https://huggingface.co/litert-community/embeddinggemma-2-text-vision-440m-litert-lm/resolve/main/embeddinggemma-2-text-vision-440m.litertlm"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare bundled EmbeddingGemma 2 model
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors "$EMBEDDING_MODEL_URL" -o app/src/main/assets/models/embeddinggemma-2-text-vision-440m.litertlm
          test -s app/src/main/assets/models/embeddinggemma-2-text-vision-440m.litertlm
          ls -lh app/src/main/assets/models/embeddinggemma-2-text-vision-440m.litertlm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify bundled model is inside APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -l "$APK" | grep 'assets/models/embeddinggemma-2-text-vision-440m.litertlm'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPhotoAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14